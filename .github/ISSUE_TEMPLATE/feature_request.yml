name: Feature request
description: Suggest a new feature or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What would you like debroxy to do?
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

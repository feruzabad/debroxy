version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # unclosed HTTP bodies leak provider connections
    - errname       # ErrXxx sentinels and XxxError types (ddd-rules N-4)
    - errorlint     # errors.Is/As and %w wrapping (ddd-rules A-6)
    - gosec
    - misspell
    - noctx         # outbound HTTP requests carry a context
    - nolintlint
    - sloglint      # log/slog only, key-value pairs (NFR-07)
    - unconvert
  settings:
    sloglint:
      kv-only: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx] # httptest.NewRequest is the idiomatic test request

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/feruzabad/debroxy
